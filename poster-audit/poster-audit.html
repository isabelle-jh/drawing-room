022/posters/enola_holmes_two.jpg"}];let running=false,cursor=0,done=0,stopped=false;const results=DATA.map(x=>({...x,status:'pending',reason:'',duration:0}));const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const ok=results.filter(x=>x.status==='success').length,fail=results.filter(x=>x.status==='failed').length;$('done').textContent=ok+fail;$('success').textContent=ok;$('failed').textContent=fail;$('progress').style.width=((ok+fail)/results.length*100)+'%';const mode=$('view').value;const arr=results.filter(x=>mode==='all'||x.status===mode);$('list').innerHTML=arr.map(x=>`<div class="entry"><img loading="lazy" src="${esc(x.status==='success'?x.url:'')}" alt=""><div><b>${esc(x.id)}. ${esc(x.title)}</b><small>${esc(x.url)}</small></div><em class="${x.status==='success'?'ok':x.status==='failed'?'fail':'pending'}">${x.status==='success'?'성공':x.status==='failed'?'실패':'미검사'}</em></div>`).join('')}
